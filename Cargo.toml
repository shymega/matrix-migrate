[package]
name = "matrix-migrate"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
env_logger = "0.11.5"
log = "0.4.22"
futures = "0.3.30"
clap = { version = "4.5.16", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing-subscriber = "0.3.18"
open = "5.3.0"
matrix-sdk = { version = "0.7.1", default-features = false, features = ["rustls-tls", "sso-login", "anyhow", "e2e-encryption", "bundled-sqlite", "experimental-sliding-sync"] }
